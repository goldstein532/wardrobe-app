# Каждые ~5 минут: забрать новые посты → обновить каталог и фото → опубликовать витрину.
# Расписание GitHub ненадёжно (запуски «*/5» на деле бывают раз в несколько часов), поэтому
# каждый прогон в конце сам запускает следующий (задача next). Расписание — запасной перезапуск цепочки.
# Данные (state.json, catalog.json, фото) живут в отдельной ветке `data`, чтобы не засорять код.
name: sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "Запуск из цепочки (служебное)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  actions: write   # чтобы запустить следующий прогон цепочки
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # первый прогон читает всю историю канала и скачивает все фото
    outputs:
      deploy: ${{ steps.need.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Ветка с данными
        run: |
          git config user.name "wardrobe-sync"
          git config user.email "wardrobe-sync@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add data FETCH_HEAD
            git -C data switch -c data
          else
            git worktree add --orphan -b data data
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Синхронизация с Telegram
        id: sync
        working-directory: backend
        env:
          # SOURCE: web (по умолчанию) — читаем публичную ленту t.me/s/, боту не нужны права в канале;
          #         bot — апдейты Bot API (бот должен быть админом канала).
          SOURCE: ${{ vars.SOURCE }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          CHANNEL_MAIN: ${{ vars.CHANNEL_MAIN }}
          CHANNEL_TRANSIT: ${{ vars.CHANNEL_TRANSIT }}
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
          WEBAPP_URL: ${{ vars.WEBAPP_URL }}
        run: python -m wardrobe.sync ../data

      - name: Сохранить данные
        run: |
          git -C data add -A
          if ! git -C data diff --cached --quiet; then
            git -C data commit -q -m "sync $(date -u +%Y-%m-%dT%H:%MZ)"
            git -C data push -q origin data
          fi

      - name: Нужно ли публиковать
        id: need
        run: |
          # Публикуем, если каталог изменился, после правок кода и при ручном запуске.
          if [ "${{ steps.sync.outputs.changed }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]              || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.chain }}" != "true" ]; }; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.need.outputs.deploy == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Сборка витрины
        if: steps.need.outputs.deploy == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cp -r ../data/site/. dist/

      - uses: actions/upload-pages-artifact@v3
        if: steps.need.outputs.deploy == 'true'
        with:
          path: frontend/dist

  # Отдельная задача, чтобы «пустые» прогоны не создавали записей о публикации.
  deploy:
    needs: sync
    if: needs.sync.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Следующий прогон через ~4 минуты. Если запусков в очереди окажется два (цепочка + расписание),
  # concurrency оставит один — цепочки не размножаются.
  next:
    needs: [sync, deploy]
    if: ${{ always() && needs.sync.result != 'cancelled' }}  # и после ошибки: сбой t.me не должен рвать цепочку
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Пауза и запуск следующего прогона
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 240
          gh workflow run sync.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f chain=true
